# Hyperparameters for run_ppo-ngopt_rlgo.py
#
# Defaults follow the original implementation of the method:
#   ppo_ngopt_rlgo/config.py:PPOConfig field defaults
#   (mirrored in ppo_ngopt_rlgo/configs/ppo.json)

# RNG seed.
seed: 0

# Training/evaluation device: auto, cpu, cuda, cuda:N, or mps.
device: auto

# Stable-Baselines3 policy class.
policy: MlpPolicy

# Total environment steps to train for.
total_timesteps: 10000

# Adam learning rate.
learning_rate: 3.0e-4

# Number of steps collected per rollout before each PPO update.
n_steps: 256

# Minibatch size PPO trains on (must divide n_steps).
batch_size: 64

# Discount factor.
gamma: 0.99

# Episodes used to compute the evaluation score after training.
evaluation_episodes: 10
